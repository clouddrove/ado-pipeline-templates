parameters:
  - name: scanPath
    type: string
    default: '$(Build.SourcesDirectory)/Dockerfile'
  - name: severity
    type: string
    default: 'CRITICAL,HIGH'
  - name: exitCode
    type: string
    default: '1'

steps:
  - task: Bash@3
    displayName: 'Trivy: IaC / Misconfig Scan'
    inputs:
      targetType: 'inline'
      script: |
        set -e
        if ! command -v trivy &> /dev/null; then
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        fi
        JUNIT_TPL="$(Agent.TempDirectory)/trivy-junit.tpl"
        if [ ! -f "$JUNIT_TPL" ]; then
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/junit.tpl -o "$JUNIT_TPL"
        fi
        mkdir -p "$(Common.TestResultsDirectory)"

        REPORT="$(Agent.TempDirectory)/trivy-iac-report.json"
        trivy config --include-non-failures --format json --output "$REPORT" ${{ parameters.scanPath }}

        trivy convert --format table --severity ${{ parameters.severity }} "$REPORT"
        # Not severity-filtering this conversion: trivy convert --severity drops
        # individual Misconfigurations entries (even passing ones) rather than
        # keeping the matched subset, which would empty out the Tests tab. Full
        # detail (all checks, pass and fail) goes to the report; the actual gate
        # below stays correctly scoped to the requested severity.
        trivy convert --format template --template "@$JUNIT_TPL" \
          --output "$(Common.TestResultsDirectory)/TEST-trivy-iac-scan.xml" "$REPORT"

        trivy convert --format json --severity ${{ parameters.severity }} --exit-code ${{ parameters.exitCode }} --output /dev/null "$REPORT"
