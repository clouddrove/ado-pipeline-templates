parameters:
  - name: scanPath
    type: string
    default: '$(Build.SourcesDirectory)'
  - name: ruleset
    type: string
    default: 'p/security-audit'
  - name: severity
    type: string
    default: 'ERROR'   # semgrep exits non-zero only on findings at/above this in --error mode

steps:
  - task: Bash@3
    displayName: 'Semgrep: SAST Scan'
    inputs:
      targetType: 'inline'
      script: |
        set -e
        python3 -m pip install --quiet --user --break-system-packages semgrep
        export PATH="$HOME/.local/bin:$PATH"
        mkdir -p "$(Common.TestResultsDirectory)"
        semgrep scan \
          --config ${{ parameters.ruleset }} \
          --severity ${{ parameters.severity }} \
          --error \
          --junit-xml-output="$(Common.TestResultsDirectory)/TEST-semgrep-sast-scan.xml" \
          ${{ parameters.scanPath }}
